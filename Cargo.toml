[workspace]
resolver = "2"
members = ["crates/dbm-core", "crates/dbm-worker", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
authors = ["Kasa India"]
license = "Proprietary"
repository = ""

# Shared dependency versions used across the workspace crates.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
keyring = { version = "3", features = ["windows-native"] }
fs2 = "0.4"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
